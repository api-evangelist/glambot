name: Glambot
description: Glambot is an online marketplace for buying and selling gently used and new makeup and
  beauty products. Shoppers can purchase discounted cosmetics from more than 100 brands including MAC,
  Urban Decay, Charlotte Tilbury, and Chanel across categories such as eyes, lashes, brows, face, cheeks,
  lips, skincare, palettes, and brushes, while sellers can mail in their unwanted makeup for cash payouts.
  Glambot operates a two-sided consumer resale platform and was surfaced as a portfolio company of 500
  Global. The company does not currently publish a public API, SDK, developer portal, or MCP surface.
